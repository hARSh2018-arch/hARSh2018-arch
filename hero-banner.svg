<svg width="100%" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="coreGlow" cx="50%" cy="70%" r="65%">
      <stop offset="0%" stop-color="#FCA311" stop-opacity="0.5"/>
      <stop offset="40%" stop-color="#D62828" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0A0500" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flameText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE8B8"/>
      <stop offset="45%" stop-color="#FCA311"/>
      <stop offset="100%" stop-color="#D62828"/>
    </linearGradient>
    <linearGradient id="flameBody" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#D62828"/>
      <stop offset="55%" stop-color="#F77F00"/>
      <stop offset="100%" stop-color="#FCA311" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="slashGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FCA311" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFF3E0" stop-opacity="1"/>
      <stop offset="100%" stop-color="#D62828" stop-opacity="0"/>
    </linearGradient>
    <filter id="glowBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur">
        <animate attributeName="stdDeviation" values="3;7;3" dur="2.4s" repeatCount="indefinite"/>
      </feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="320" fill="#0A0500"/>
  <rect width="1200" height="320" fill="url(#coreGlow)"/>

  <!-- flickering flame silhouettes along the base -->
  <g filter="url(#softBlur)" opacity="0.85">
    <path d="M 40 320 Q 30 250 70 210 Q 60 260 100 230 Q 90 280 140 250 Q 150 300 190 320 Z" fill="url(#flameBody)">
      <animateTransform attributeName="transform" type="scale" values="1,1;1,1.08;0.97,0.94;1,1" dur="1.6s" repeatCount="indefinite" additive="sum"/>
    </path>
    <path d="M 220 320 Q 210 240 260 195 Q 245 255 300 220 Q 285 275 340 245 Q 350 295 400 320 Z" fill="url(#flameBody)">
      <animateTransform attributeName="transform" type="scale" values="1,1;0.95,1.1;1.03,0.95;1,1" dur="1.9s" begin="0.3s" repeatCount="indefinite" additive="sum"/>
    </path>
    <path d="M 800 320 Q 790 240 840 195 Q 825 255 880 220 Q 865 275 920 245 Q 930 295 980 320 Z" fill="url(#flameBody)">
      <animateTransform attributeName="transform" type="scale" values="1,1;1.05,0.92;0.96,1.07;1,1" dur="1.7s" begin="0.15s" repeatCount="indefinite" additive="sum"/>
    </path>
    <path d="M 1000 320 Q 990 250 1030 210 Q 1020 260 1060 230 Q 1050 280 1100 250 Q 1110 300 1150 320 Z" fill="url(#flameBody)">
      <animateTransform attributeName="transform" type="scale" values="1,1;0.94,1.1;1.04,0.93;1,1" dur="2.1s" begin="0.5s" repeatCount="indefinite" additive="sum"/>
    </path>
  </g>

  <!-- rising embers -->
  <g fill="#FCA311">
    <circle cx="120" cy="300" r="3" opacity="0.8">
      <animate attributeName="cy" values="300;-20" dur="4.5s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0" dur="4.5s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="260" cy="310" r="2" opacity="0.7" fill="#D62828">
      <animate attributeName="cy" values="310;-10" dur="5.2s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="5.2s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="410" cy="295" r="2.5" opacity="0.75">
      <animate attributeName="cy" values="295;-15" dur="3.8s" begin="1.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.85;0" dur="3.8s" begin="1.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="305" r="3.2" opacity="0.8" fill="#FFE8B8">
      <animate attributeName="cy" values="305;-25" dur="5s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0" dur="5s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="780" cy="300" r="2" opacity="0.7" fill="#D62828">
      <animate attributeName="cy" values="300;-10" dur="4.2s" begin="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="4.2s" begin="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="930" cy="310" r="2.8" opacity="0.8">
      <animate attributeName="cy" values="310;-15" dur="4.7s" begin="0.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0" dur="4.7s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1080" cy="295" r="2.3" opacity="0.75" fill="#FFE8B8">
      <animate attributeName="cy" values="295;-20" dur="5.5s" begin="1.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.85;0" dur="5.5s" begin="1.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="300" r="2.4" opacity="0.7" fill="#D62828">
      <animate attributeName="cy" values="300;-18" dur="4.9s" begin="2.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="4.9s" begin="2.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="308" r="2.6" opacity="0.75" fill="#FFE8B8">
      <animate attributeName="cy" values="308;-12" dur="4.3s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.85;0" dur="4.3s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- slash streak sweeping through on a loop -->
  <rect x="-400" y="150" width="300" height="4" fill="url(#slashGrad)" transform="rotate(-8 600 160)">
    <animate attributeName="x" values="-400;1300" dur="3.2s" begin="0s" repeatCount="indefinite"/>
  </rect>

  <!-- main title -->
  <text x="600" y="150" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="64" font-weight="800" fill="url(#flameText)" filter="url(#glowBlur)">
    SUN BREATHING
  </text>

  <!-- subtitle -->
  <text x="600" y="195" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="17" letter-spacing="3" fill="#ffb703" opacity="0">
    THE ORIGIN TECHNIQUE — ALL OTHER STYLES TRACE BACK TO THIS
    <animate attributeName="opacity" values="0;0;1" dur="2s" begin="0.5s" fill="freeze"/>
  </text>

  <!-- pulse ring under title -->
  <circle cx="600" cy="160" r="40" fill="none" stroke="#FCA311" stroke-width="1.5" opacity="0">
    <animate attributeName="r" values="40;220" dur="2.6s" begin="0s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0" dur="2.6s" begin="0s" repeatCount="indefinite"/>
  </circle>

  <!-- bottom status line -->
  <text x="600" y="270" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="#D62828">
    <tspan opacity="0.9">&#9679;</tspan>
    <tspan dx="8" fill="#E8E8E8">TOTAL CONCENTRATION: CONSTANT</tspan>
  </text>
</svg>
